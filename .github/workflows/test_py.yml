name: Python test

on:
  push:
    branches: main
    paths:
      - 'clients/python/**'
      - '.github/workflows/test_py.yml'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: [main]
    paths:
      - 'clients/python/**'
      - '.github/workflows/test_py.yml'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

env:
  LIBZIP_VERSION: "1.11.4"
  ZLIB_VERSION: "1.3.1"
  CMAKE_BUILD_TYPE: "Release"
  LIBZIP_INSTALL_PREFIX_UNIX: "/usr/local"

jobs:
  build-and-test-macos:
    name: Build & Test - Python ${{ matrix.python-version }}
    runs-on: macos-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']

    defaults:
      run:
        working-directory: clients/python

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Clean existing libraries
      run: rm -f tacozip/libtacozip.* tacozip/tacozip.dll || true

    - name: Fix newlines for Apple Clang
      run: |
        cd ../..
        echo "" >> include/tacozip.h
        echo "" >> src/tacozip.c

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov cmake ninja

    - name: Build universal libzip
      run: |
        cd ../..
        curl -L https://github.com/nih-at/libzip/archive/refs/tags/v${{ env.LIBZIP_VERSION }}.tar.gz \
          -o libzip-${{ env.LIBZIP_VERSION }}.tar.gz
        tar -xzf libzip-${{ env.LIBZIP_VERSION }}.tar.gz
        
        cmake -S libzip-${{ env.LIBZIP_VERSION }} -B build-libzip \
          -DCMAKE_INSTALL_PREFIX="${{ env.LIBZIP_INSTALL_PREFIX_UNIX }}" \
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DENABLE_COMMONCRYPTO=OFF \
          -DENABLE_GNUTLS=OFF \
          -DENABLE_MBEDTLS=OFF \
          -DENABLE_OPENSSL=OFF \
          -DENABLE_WINDOWS_CRYPTO=OFF \
          -DENABLE_BZIP2=OFF \
          -DENABLE_LZMA=OFF \
          -DENABLE_ZSTD=OFF \
          -DBUILD_TOOLS=OFF \
          -DBUILD_REGRESS=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_DOC=OFF
        
        cmake --build build-libzip -j
        sudo cmake --install build-libzip

    - name: Build tacozip native library
      run: |
        cd ../..
        python clients/python/prebuild.py
        test -f clients/python/tacozip/libtacozip.dylib || exit 1

    - name: Set library paths
      run: |
        echo "DYLD_LIBRARY_PATH=${{ env.LIBZIP_INSTALL_PREFIX_UNIX }}/lib" >> $GITHUB_ENV
        echo "DYLD_FALLBACK_LIBRARY_PATH=${{ env.LIBZIP_INSTALL_PREFIX_UNIX }}/lib:/usr/local/lib:/usr/lib" >> $GITHUB_ENV

    - name: Install package
      run: pip install -e .

    - name: Verify installation
      run: python -c "import tacozip; tacozip.self_check(); print('OK')"

    - name: Test basic functionality
      run: |
        python -c "
        import tacozip
        assert tacozip.TACOZ_OK == 0
        assert hasattr(tacozip, 'create')
        assert hasattr(tacozip, 'read_header')
        assert hasattr(tacozip, 'update_header')
        assert hasattr(tacozip, 'get_library_version')
        tacozip.self_check()
        print('All tests passed')
        "

    - name: Run test suite
      run: pytest tests/ -v

    - name: Run coverage
      run: pytest tests/ --cov=tacozip --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: clients/python/coverage.xml
        flags: macos-py${{ matrix.python-version }}