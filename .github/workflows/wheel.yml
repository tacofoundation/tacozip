name: Python wheels

on:
  push:
    branches: main
  
env:
  LIBZIP_VERSION: "1.11.4"
  ZLIB_VERSION: "1.3.1"
  CMAKE_BUILD_TYPE: "Release"
  LIBZIP_INSTALL_PREFIX_UNIX: "/usr/local"
  LIBZIP_INSTALL_PREFIX_WIN: "C:/deps"

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Clean existing native libraries
        shell: bash
        run: |
          rm -f clients/python/tacozip/libtacozip.* clients/python/tacozip/tacozip.dll || true

      - name: Fix newlines for Apple Clang
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "" >> include/tacozip.h
          echo "" >> src/tacozip.c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up QEMU for ARM64
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install cibuildwheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install 'cibuildwheel==2.*'

      - name: Build wheels
        shell: bash
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686"

          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux2014"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          
          CIBW_BEFORE_BUILD_LINUX: |
            set -e
            python -m pip install cmake ninja
            curl -L https://github.com/nih-at/libzip/archive/refs/tags/v${{ env.LIBZIP_VERSION }}.tar.gz -o libzip.tar.gz
            tar -xzf libzip.tar.gz
            cmake -S libzip-${{ env.LIBZIP_VERSION }} -B build-libzip -DCMAKE_INSTALL_PREFIX="${{ env.LIBZIP_INSTALL_PREFIX_UNIX }}" -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DBUILD_SHARED_LIBS=ON -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF -DENABLE_WINDOWS_CRYPTO=OFF -DENABLE_BZIP2=OFF -DENABLE_LZMA=OFF -DENABLE_ZSTD=OFF -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF
            cmake --build build-libzip -j
            cmake --install build-libzip
            python {package}/prebuild.py

          CIBW_ARCHS_MACOS: "universal2"
          CIBW_ENVIRONMENT_MACOS: |
            MACOSX_DEPLOYMENT_TARGET=11.0
            CFLAGS="-O3 -ffast-math -Wno-nullability-extension"
            CXXFLAGS="-O3 -ffast-math -Wno-nullability-extension"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            bash -exc "python -m pip install delocate && delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
          
          CIBW_BEFORE_BUILD_MACOS: |
            set -e
            python -m pip install cmake ninja
            curl -L https://github.com/nih-at/libzip/archive/refs/tags/v${{ env.LIBZIP_VERSION }}.tar.gz -o libzip.tar.gz
            tar -xzf libzip.tar.gz
            cmake -S libzip-${{ env.LIBZIP_VERSION }} -B build-libzip -DCMAKE_INSTALL_PREFIX="${{ env.LIBZIP_INSTALL_PREFIX_UNIX }}" -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DBUILD_SHARED_LIBS=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_C_FLAGS="-O3 -ffast-math -Wno-nullability-extension" -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF -DENABLE_WINDOWS_CRYPTO=OFF -DENABLE_BZIP2=OFF -DENABLE_LZMA=OFF -DENABLE_ZSTD=OFF -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF
            cmake --build build-libzip -j
            sudo cmake --install build-libzip
            python {package}/prebuild.py

          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT_WINDOWS: |
            CMAKE_BUILD_TYPE=Release
          
          CIBW_BEFORE_BUILD_WINDOWS: >
            python -m pip install cmake ninja &&
            curl -L https://github.com/madler/zlib/archive/refs/tags/v${{ env.ZLIB_VERSION }}.zip -o zlib.zip &&
            powershell -Command "Expand-Archive zlib.zip -DestinationPath ." &&
            cmake -S zlib-${{ env.ZLIB_VERSION }} -B build-zlib -DCMAKE_INSTALL_PREFIX="${{ env.LIBZIP_INSTALL_PREFIX_WIN }}" -DBUILD_SHARED_LIBS=ON &&
            cmake --build build-zlib --config ${{ env.CMAKE_BUILD_TYPE }} &&
            cmake --install build-zlib &&
            curl -L https://github.com/nih-at/libzip/archive/refs/tags/v${{ env.LIBZIP_VERSION }}.zip -o libzip.zip &&
            powershell -Command "Expand-Archive libzip.zip -DestinationPath ." &&
            cmake -S libzip-${{ env.LIBZIP_VERSION }} -B build-libzip -DCMAKE_INSTALL_PREFIX="${{ env.LIBZIP_INSTALL_PREFIX_WIN }}" -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DBUILD_SHARED_LIBS=ON -DCMAKE_PREFIX_PATH="${{ env.LIBZIP_INSTALL_PREFIX_WIN }}" -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF -DENABLE_WINDOWS_CRYPTO=OFF -DENABLE_BZIP2=OFF -DENABLE_LZMA=OFF -DENABLE_ZSTD=OFF -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF &&
            cmake --build build-libzip --config ${{ env.CMAKE_BUILD_TYPE }} &&
            cmake --install build-libzip &&
            python {package}/prebuild.py

          CIBW_TEST_COMMAND: python -c "import tacozip; tacozip.self_check(); print('tacozip test passed')"

        run: |
          cibuildwheel clients/python --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build source distribution
        run: |
          cd clients/python
          python -m pip install build
          python -m build --sdist

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Copy sdist
        shell: bash
        run: |
          cp clients/python/dist/*.tar.gz dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages_dir: dist
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true